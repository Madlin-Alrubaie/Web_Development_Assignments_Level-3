<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>1. شرح localStorage</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            max-width: 520px;
            margin: 40px auto;
            background: #f4f6f8;
            padding: 20px;
        }

        .card {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        input,
        button {
            padding: 10px;
            font-size: 15px;
            margin: 5px 0;
        }

        input {
            width: 68%;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            cursor: pointer;
            border: none;
            border-radius: 6px;
            background: #1e6091;
            color: #fff;
        }

        button.danger {
            background: #c1121f;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 15px;
        }

        li {
            background: #eef3f7;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>

<body>
    <div class="card">
        <div style="margin-bottom: 15px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px;">
            <a href="index.html" style="color: #1e6091; text-decoration: none; font-size: 14px; font-weight: bold;">←
                العودة إلى المحاضرة النظرية</a>
        </div>
        <h2>تطبيق localStorage: قائمة مهام الطالب</h2>
        <p>أضف مهامك، ثم أعد تحميل الصفحة أو أغلق المتصفح وافتحه مجددًا.</p>

        <input type="text" id="taskInput" placeholder="اكتب مهمة جديدة..." />
        <button onclick="add()">إضافة</button>
        <button class="danger" onclick="clear_all()">مسح الكل</button>
        <ul id="taskList"></ul>
    </div>

    <script>
        const KEY = "student_tasks";

        function get() {
            const saved = localStorage.getItem(KEY);

            if (saved !== null) {
                return JSON.parse(saved);
            } else {
                return [];
            }
        }

        function show() {
            const arr = get();
            const box = document.getElementById("taskList");
            box.innerHTML = "";

            for (let n = 0; n < arr.length; n++) {
                const value = arr[n];
                const item = document.createElement("li");

                item.innerHTML = `
                                   <span>${value}</span>
                                   <button class="danger" onclick="del(${n})">حذف</button>
                               `;

                box.appendChild(item);
            }
        }

        function add() {
            const field = document.getElementById("taskInput");
            const value = field.value.trim();

            if (!value) return;

            const arr = get();
            arr.push(value);

            localStorage.setItem(KEY, JSON.stringify(arr));

            field.value = "";

            show();
        }

        function del(pos) {
            const arr = get();

            arr.splice(pos, 1);

            localStorage.setItem(KEY, JSON.stringify(arr));

            show();
        }

        function clear_all() {
            localStorage.removeItem(KEY);
            show();
        }

        show();
    </script>
</body>

</html>
