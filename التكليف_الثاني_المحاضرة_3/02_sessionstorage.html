<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>2. شرح sessionStorage</title>
  <style>
    body { font-family: Tahoma, sans-serif; max-width: 520px; margin: 40px auto; background: #f4f6f8; padding: 20px; }
    .card { background: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    input, textarea, button { width: 100%; box-sizing: border-box; padding: 10px; margin: 8px 0; font-size: 15px; border-radius: 6px; border: 1px solid #ccc; }
    button { background: #2a9d8f; color: #fff; border: none; cursor: pointer; }
    .badge { background: #e9c46a; padding: 6px 10px; border-radius: 5px; display: inline-block; font-weight: bold; }
  </style>
</head>
<body>
  <div class="card">
    <div style="margin-bottom: 15px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px;">
      <a href="index.html" style="color: #2a9d8f; text-decoration: none; font-size: 14px; font-weight: bold;">← العودة إلى المحاضرة النظرية</a>
    </div>
    <h2>تطبيق sessionStorage: حفظ صفحة مؤقتة</h2>
    <p>عدد مرات تحديث هذا التبويب: <span class="badge" id="visitCounter">0</span></p>
    <p>اكتب بياناتك، اضغط F5 (ستبقى)، ثم افتح نفس الرابط في تبويب جديد (ستبدأ من الصفر).</p>

    <input type="text" id="fullName" oninput="save()" />
    <textarea id="notes" rows="4" oninput="save()"></textarea>
    <button onclick="send()">إرسال النموذج ومسح الجلسة</button>
  </div>

  <script>
    let oldCount = sessionStorage.getItem("tab_reloads");

    let num;
    if (oldCount === null) {
      num = 0;
    } else {
      num = Number(oldCount);
    }

    num = num + 1;
    sessionStorage.setItem("tab_reloads", num);
    document.getElementById("visitCounter").textContent = num;

    window.addEventListener("DOMContentLoaded", () => {
      document.getElementById("fullName").value = sessionStorage.getItem("draft_name") || "";
      document.getElementById("notes").value = sessionStorage.getItem("draft_notes") || "";
    });

    function save() {
      sessionStorage.setItem("draft_name", document.getElementById("fullName").value);
      sessionStorage.setItem("draft_notes", document.getElementById("notes").value);
    }

    function send() {
      alert("تم إرسال البيانات بنجاح!");
      sessionStorage.clear();
      document.getElementById("fullName").value = "";
      document.getElementById("notes").value = "";
    }
  </script>
</body>
</html>
