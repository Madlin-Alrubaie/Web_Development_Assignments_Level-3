

<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ماركتي</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

      
        <header>
            <div>
                <h1>ويلكم<span>♡</span></h1>
                <p>كل احتياجاتك في قائمة واحدة</p>
            </div>

            <div class="basket">🛍️</div>
        </header>


        <!-- Date and Time -->
        <div class="date-box">
            <p id="day"></p>
            <h3 id="date"></h3>
            <p id="time"></p>
        </div>


      
        <section class="card">

            <h2>إضافة منتج جديد</h2>

            <label>اسم المنتج</label>
            <input type="text" id="product"
                   placeholder="مثلاً: حليب، موز، خبز">

            <div class="inputs">

                <div>
                    <label>السعر (ريال)</label>
                    <input type="number" id="price"
                           placeholder="السعر" step="100" min="0">
                </div>

                <div>
                    <label>الكمية</label>
                    <input type="number" id="quantity"
                           placeholder="الكمية">
                </div>

            </div>

            <button class="add-btn" onclick="addProduct()">
                + إضافة إلى القائمة
            </button>

        </section>


       
        <section class="card">

            <h2>قائمة مشترياتي</h2>

            <p id="empty">لم تضيفي أي منتجات بعد ♡</p>

            <ul id="items"></ul>

            <div class="total-box">
                <span>الإجمالي الكلي</span>
                <strong id="total">0 ريال</strong>
            </div>

            <button class="clear-btn" onclick="clearCart()">
                إفراغ القائمة
            </button>

        </section>


        <footer>
            انجوي يور داي ♡
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
